version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Backend REST API Service (FastAPI / Uvicorn)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: recoverai_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./recoverai.db
      - SIMULATION_MODE=true
      - LLM_PROVIDER=mock
      - LOG_LEVEL=INFO
      - CORS_ALLOWED_ORIGINS=http://localhost:8501,http://127.0.0.1:8501,http://localhost:3000,http://frontend:8501
    volumes:
      - ./recoverai.db:/app/recoverai.db
      - ./ml/artifacts:/app/ml/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - recoverai_net

  # ----------------------------------------------------------------------------
  # Frontend Dashboard Service (Streamlit)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: recoverai_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
      - SIMULATION_MODE=true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - recoverai_net

networks:
  recoverai_net:
    driver: bridge
