# ==============================================================================
# RecoverAI — Render Infrastructure as Code (Blueprint)
# ==============================================================================
# Deploys RecoverAI FastAPI backend on Render using Docker runtime.
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: recoverai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SIMULATION_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./recoverai.db
      - key: CORS_ALLOWED_ORIGINS
        value: "https://share.streamlit.io,https://*.streamlit.app,http://localhost:8501"
      - key: LOG_LEVEL
        value: INFO
      - key: HIGH_CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: OUTREACH_THRESHOLD
        value: "0.45"
      - key: MAX_RETRY_ATTEMPTS
        value: "3"
